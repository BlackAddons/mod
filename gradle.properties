# Done to increase the memory available to Gradle.
org.gradle.jvmargs=-Xmx2G
# Mod Properties
mod_version=1.0.1
maven_group=org.blackaddons
# GitLab package registry
# Where `:api` is published, and where an addon in its own repository reads it from - the endpoint
# GitLab's own Packages page hands out. In a pipeline the id comes from CI_PROJECT_ID instead.
#
# The NUMERIC id, not the path: Gradle decodes `%2F` in a repository URL, so the path form never
# reaches GitLab intact. (The group endpoint reads several publishing projects through one URL;
# only this project publishes, so it buys nothing.)
gitlab_host=https://gitlab.blackaddons.com
gitlab_project_id=17
# Path form, for the POM's project URL and for documentation links.
gitlab_project=blackaddons/blackaddons-reimagined
# Toolchain - Kotlin is pinned once, here: settings.gradle.kts applies the plugin at this version and
# buildSrc puts the same one on the convention plugins' classpath. It must also match the Kotlin that
# fabric-language-kotlin ships at runtime (see mc263_kotlin_loader_version below).
kotlin_version=2.4.21
# Fabric Loom, put on buildSrc's classpath and applied by its platform convention plugins. 1.19 needs Gradle 9.8.
loom_version=1.18.4
# JUnit - the test framework for the pure-JVM modules.
junit_version=6.1.3
# REI's basic-math library, compile-only. REI's own version is set per platform below.
rei_basic_math_version=0.6.1
# Libraries
# ClassGraph - https://github.com/classgraph/classgraph. Bundled into the jar (feature auto-discovery
# needs it at runtime); everything below it is provided by Minecraft instead.
classgraph_version=6.0.0
# SLF4J - logging facade
slf4j_version=2.0.17
# Gson - JSON
gson_version=2.13.2
# JOML - math types (Matrix3x2fc)
joml_version=1.10.8
# JetBrains annotations are required by the shared JVM module convention.
annotations_version=26.1.0
# Minecraft 26.3 platform
# Prefixed by platform, because a second Minecraft version brings its own set and the two must not be
# able to shadow each other. Gradle reads gradle.properties only from the root project, so a per-
# platform properties file is not an option - the prefix is what keeps them apart.
mc263_minecraft_version=26.3
mc263_loader_version=0.20.1
mc263_kotlin_loader_version=1.14.2+kotlin.2.4.21
mc263_fabric_version=0.166.2+26.3
# BlackSkija - https://jitpack.io/#DreamcastERA1/BlackSkija
# Our own Skija-backed renderer. Now a per-MC-version artifact (blackskija-26.3 / -26.2); bump after
# publishing a new BlackSkija release to JitPack.
mc263_blackskija_version=3.4.0
mc263_skija_version=0.143.18
# BlackVertex - https://jitpack.io/#DreamcastERA1/BlackVertex
# Our own skeletal-mesh renderer, backs 3D cosmetics. Per-MC-version artifact (blackvertex-26.3 / -26.2).
mc263_blackvertex_version=1.1.4
mc263_ias_version=9.0.8+26.3-fabric
mc263_modmenu_version=21.0.0
mc263_iris_version=1.11.7+26.3-fabric
mc263_sodium_version=mc26.3-0.9.3-beta.4-fabric
mc263_rei_version=26.3.824+fabric
mc263_archives_base_name=blackaddonsreimagined-26.3
# Minecraft 26.2 platform
# Same shape as the 26.3 block; still on GLFW and the com.mojang.blaze3d render API.
mc262_minecraft_version=26.2
mc262_loader_version=0.20.1
mc262_kotlin_loader_version=1.14.2+kotlin.2.4.21
mc262_fabric_version=0.161.0+26.2
mc262_blackskija_version=3.4.0
mc262_skija_version=0.143.18
mc262_blackvertex_version=1.1.4
mc262_ias_version=9.0.8+26.2-fabric
mc262_modmenu_version=20.0.3
mc262_iris_version=1.11.4+26.2-fabric
mc262_sodium_version=mc26.2-0.9.2-fabric
mc262_rei_version=26.2.820+fabric
mc262_archives_base_name=blackaddonsreimagined-26.2
